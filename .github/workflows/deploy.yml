name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home/deploy/apps/gelerner

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure target directory exists
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

      - name: Rsync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='backend/venv' \
            --exclude='backend/db.sqlite3' \
            --exclude='backend/staticfiles' \
            --exclude='backend/.env' \
            --exclude='frontend/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Run deploy.sh on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash '${{ env.DEPLOY_PATH }}/deploy/deploy.sh'"

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "curl -fsS -H 'Host: ge.zlgvpn.org' -o /dev/null -w 'gunicorn -> HTTP %{http_code}\n' http://127.0.0.1:8731/api/categories/ && sudo systemctl is-active gelerner"
